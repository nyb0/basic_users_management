; =============================================================================
; PHP CONFIGURATION - Development Mode
; =============================================================================
;
; WHAT THIS FILE DOES:
; This file configures PHP runtime settings.
; These settings apply to all PHP scripts running in this container.
;
; HOW PHP.INI WORKS:
; 1. PHP starts and reads configuration files
; 2. Settings in this file override defaults
; 3. Some settings can be changed at runtime (ini_set())
; 4. Some settings are system-only (can't be changed at runtime)
;
; =============================================================================

; -----------------------------------------------------------------------------
; PHP BASIC SETTINGS
; -----------------------------------------------------------------------------

[PHP]

; Memory limit for PHP scripts
; Laravel typically needs at least 128MB, more for complex operations
; Development: Higher limit for debugging tools
memory_limit = 256M

; Maximum file upload size
; Also needs to be set in Nginx (client_max_body_size)
upload_max_filesize = 50M

; Maximum POST data size
; Should be >= upload_max_filesize
post_max_size = 50M

; Maximum execution time (seconds)
; Longer for development (debugging slow code)
max_execution_time = 300

; Maximum input time (seconds)
; Time for parsing input data (POST, GET)
max_input_time = 300

; Maximum input variables
; Large forms may need more (e.g., multi-select fields)
max_input_vars = 3000

; -----------------------------------------------------------------------------
; ERROR HANDLING - DEVELOPMENT MODE
; -----------------------------------------------------------------------------

; Display errors to screen (ON for development, OFF for production)
display_errors = On
display_startup_errors = On

; Log errors to file
log_errors = On

; Error log file location
error_log = /var/log/php/error.log

; Error reporting level
; E_ALL: All errors
; ~E_DEPRECATED: Exclude deprecation warnings
; ~E_STRICT: Exclude strict mode warnings
; Development: Show everything
error_reporting = E_ALL

; -----------------------------------------------------------------------------
; OPCACHE SETTINGS - DEVELOPMENT MODE
; -----------------------------------------------------------------------------
; Opcache compiles PHP code and caches it for faster execution.
; For development, we want code changes to be detected immediately.
; -----------------------------------------------------------------------------

; Enable opcache
opcache.enable = 1

; Memory allocated for cached scripts (MB)
opcache.memory_consumption = 128

; Memory for interned strings (MB)
opcache.interned_strings_buffer = 8

; Maximum number of cached files
opcache.max_accelerated_files = 10000

; How often to check for file changes (seconds)
; 0 = check every request (development)
; 2+ = check every N seconds (production)
opcache.revalidate_freq = 0

; Check for updated scripts
; ON for development (detect code changes)
; OFF for production (better performance)
opcache.validate_timestamps = 1

; Fast shutdown optimization
opcache.fast_shutdown = 1

; Enable JIT (Just-In-Time) compiler (PHP 8.0+)
; Can significantly improve performance
; 1255 = tracing JIT with all optimizations
opcache.jit_buffer_size = 100M
opcache.jit = 1255

; -----------------------------------------------------------------------------
; SESSION SETTINGS
; -----------------------------------------------------------------------------

; Session save handler
; 'files' = store in files (default)
; 'redis' = store in Redis (better for distributed systems)
session.save_handler = files

; Session save path
session.save_path = /tmp

; Session cookie settings
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; Session garbage collection
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 7200

; -----------------------------------------------------------------------------
; DATE SETTINGS
; -----------------------------------------------------------------------------

[Date]
; Default timezone
; Full list: https://www.php.net/manual/en/timezones.php
date.timezone = UTC

; -----------------------------------------------------------------------------
; MYSQL SETTINGS
; -----------------------------------------------------------------------------

[mysql]
; MySQL default host (can be overridden in code)
mysql.default_host =

[mysqli]
; MySQLi default port
mysqli.default_port = 3306

; -----------------------------------------------------------------------------
; CURL SETTINGS
; -----------------------------------------------------------------------------

[curl]
; CURL configuration
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; -----------------------------------------------------------------------------
; OPENSSL SETTINGS
; -----------------------------------------------------------------------------

[openssl]
; OpenSSL configuration
openssl.cafile = /etc/ssl/certs/ca-certificates.crt

; -----------------------------------------------------------------------------
; MAIL SETTINGS
; -----------------------------------------------------------------------------
; For development, you might use Mailhog or similar

[mail function]
SMTP = localhost
smtp_port = 25

; =============================================================================
; DEVELOPMENT VS PRODUCTION CHANGES:
; =============================================================================
;
; FOR PRODUCTION, YOU WOULD CHANGE:
;
; 1. ERROR HANDLING:
;    display_errors = Off
;    display_startup_errors = Off
;    error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
;
; 2. OPCACHE:
;    opcache.revalidate_freq = 2
;    opcache.validate_timestamps = 0
;    opcache.preload = /var/www/html/storage/framework/preload.php
;    opcache.preload_user = www-data
;
; 3. MEMORY (based on server resources):
;    memory_limit = 128M (or higher if needed)
;
; 4. SESSION:
;    session.cookie_secure = 1 (if using HTTPS)
;    session.save_handler = redis (for distributed systems)
;
; 5. EXPOSE PHP:
;    expose_php = Off (hide PHP version in headers)
;
; 6. DISABLE DANGEROUS FUNCTIONS:
;    disable_functions = exec,passthru,shell_exec,system,proc_open,popen
;
; 7. ADD SECURITY SETTINGS:
;    allow_url_fopen = Off
;    allow_url_include = Off
;
; 8. INCREASE JIT BUFFER:
;    opcache.jit_buffer_size = 256M or more
;
; =============================================================================