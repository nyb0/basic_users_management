; =============================================================================
; PHP-FPM POOL CONFIGURATION - Development Mode
; =============================================================================
;
; WHAT THIS FILE DOES:
; This file configures the PHP-FPM process pool.
; PHP-FPM manages PHP processes that handle requests from Nginx.
;
; KEY CONCEPTS:
; - Pool: A group of PHP worker processes
; - pm (Process Manager): Controls how processes are created/destroyed
; - listen: Where PHP-FPM accepts connections (port or socket)
;
; NOTE: PHP-FPM uses ; for comments, NOT #
; =============================================================================

; -----------------------------------------------------------------------------
; POOL NAME
; -----------------------------------------------------------------------------
; [www] is the pool name. You can have multiple pools with different configs.
; Each pool can have different users, resources, and settings.
[www]

; -----------------------------------------------------------------------------
; USER AND GROUP
; -----------------------------------------------------------------------------
; Run PHP processes as www-data (standard web server user)
; This is important for security - don't run as root!
user = www-data
group = www-data

; -----------------------------------------------------------------------------
; LISTEN ADDRESS
; -----------------------------------------------------------------------------
; This is CRITICAL for Docker with separate containers!
;
; Options:
; 1. Socket: listen = /run/php/php-fpm.sock (faster, but same machine only)
; 2. IP:Port: listen = 127.0.0.1:9000 (TCP, allows remote connections)
; 3. All interfaces: listen = 9000 (accepts from any IP)
;
; For separate Docker containers, we MUST use TCP (option 2 or 3).
; Nginx container connects to PHP-FPM container over the Docker network.
;
; Using 9000 without IP means "listen on all interfaces"
; This allows Nginx to connect from its container.
listen = 9000

; -----------------------------------------------------------------------------
; LISTEN OWNER (for sockets only)
; -----------------------------------------------------------------------------
; These settings are for Unix sockets, not TCP.
; They're ignored when using TCP (port 9000).
; Keeping them for reference if you switch to sockets.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; -----------------------------------------------------------------------------
; PROCESS MANAGER SETTINGS
; -----------------------------------------------------------------------------
; pm = dynamic: Process count changes based on load
; Alternative: static (fixed count) or ondemand (create when needed)
pm = dynamic

; Maximum number of child processes
; Each process handles one request at a time
; More processes = more concurrent requests, but more memory
; Calculate: Total RAM / RAM per PHP process
pm.max_children = 50

; Number of processes to start when PHP-FPM starts
; Should be between min_spare_servers and max_spare_servers
pm.start_servers = 10

; Minimum number of idle processes
; PHP-FPM will create more if idle processes fall below this
pm.min_spare_servers = 5

; Maximum number of idle processes
; PHP-FPM will kill excess processes above this
pm.max_spare_servers = 20

; Maximum requests per process before restart
; Prevents memory leaks from accumulating
; 0 = unlimited (not recommended for long-running processes)
pm.max_requests = 500

; -----------------------------------------------------------------------------
; ENVIRONMENT VARIABLES
; -----------------------------------------------------------------------------
; clear_env = no: Keep environment variables from Docker
; This is IMPORTANT for Laravel - it needs DB_HOST, REDIS_HOST, etc.
; If yes, you'd need to explicitly pass each variable.
clear_env = no

; -----------------------------------------------------------------------------
; LOGGING
; -----------------------------------------------------------------------------
; Catch worker output (stdout/stderr) - sends to main error log
catch_workers_output = yes

; Decorate workers output (prefix with pool name)
decorate_workers_output = no