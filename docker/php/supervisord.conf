# =============================================================================
# SUPERVISOR CONFIGURATION - Development Mode
# =============================================================================
#
# WHAT THIS FILE DOES:
# Supervisor is a process manager that keeps our services running.
# If a process crashes, Supervisor automatically restarts it.
#
# WHY USE SUPERVISOR:
# - Docker containers need a single main process
# - But we need multiple processes (PHP-FPM + Queue Workers)
# - Supervisor manages all of them and restarts on failure
#
# CONFIGURATION STRUCTURE:
# - [supervisord]: Main supervisor settings
# - [program:name]: Individual process configurations
# - [group:name]: Group processes together (optional)
#
# =============================================================================

# -----------------------------------------------------------------------------
# MAIN SUPERVISORD SETTINGS
# -----------------------------------------------------------------------------
[supervisord]
# nodaemon=true: Run in foreground (required for Docker)
# If false, supervisor would daemonize and the container would exit immediately
nodaemon=true

# user: Run as root (needed to spawn processes as www-data)
# In production, you might want to run as non-root
user=root

# Log file for supervisor itself
logfile=/var/log/supervisor/supervisord.log

# PID file (process ID file, used to track if supervisor is running)
pidfile=/var/run/supervisord.pid

# Log level: debug, info, warn, error, critical
# Use 'info' for development, 'error' for production
loglevel=info

# -----------------------------------------------------------------------------
# PHP-FPM PROCESS
# -----------------------------------------------------------------------------
# PHP-FPM (FastCGI Process Manager) handles PHP requests.
# It listens on port 9000 and Nginx sends PHP requests to it.
# -----------------------------------------------------------------------------
[program:php-fpm]
# Command to start PHP-FPM
# -F: Run in foreground (don't daemonize)
# -R: Allow running as root (we'll switch to www-data in pool config)
command=php-fpm -F

# Start automatically when supervisor starts
autostart=true

# Restart automatically if the process crashes
autorestart=true

# Redirect stderr to stdout (combine logs)
redirect_stderr=true

# Log files for this process
# %(program_name)s is replaced with 'php-fpm'
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# Priority (lower = start first)
priority=10

# -----------------------------------------------------------------------------
# LARAVEL QUEUE WORKER
# -----------------------------------------------------------------------------
# Queue workers process background jobs (sending emails, processing uploads, etc.)
# We run multiple workers for better throughput.
#
# How Laravel Queues Work:
# 1. App dispatches job to queue (stored in Redis)
# 2. Queue worker picks up job
# 3. Worker processes job
# 4. On success: job removed from queue
# 5. On failure: job retried or moved to failed_jobs table
# -----------------------------------------------------------------------------
[program:laravel-worker]
# Process name template
# %(process_num)02d = process number with leading zero (01, 02, etc.)
process_name=%(program_name)s_%(process_num)02d

# Command to run the queue worker
# php artisan queue:work - Process jobs from the queue
# redis - Use Redis as the queue driver
# --sleep=3 - Sleep 3 seconds when no jobs available (saves CPU)
# --tries=3 - Retry failed jobs up to 3 times
# --max-time=3600 - Restart worker after 1 hour (prevents memory leaks)
# --timeout=60 - Maximum time a job can run (60 seconds)
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60

# Start automatically
autostart=true

# Restart automatically on failure
autorestart=true

# When stopping, stop the whole process group
stopasgroup=true
killasgroup=true

# Run as www-data (not root) for security
user=www-data

# Number of worker processes to run
# More workers = more jobs processed simultaneously
# But also more memory/CPU usage
numprocs=2

# Redirect stderr to stdout
redirect_stderr=true

# Log file for queue worker output
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# How long to wait for graceful shutdown
# Jobs might take time to complete
stopwaitsecs=3600

# Priority (start after PHP-FPM)
priority=20

# -----------------------------------------------------------------------------
# LARAVEL SCHEDULER (Optional - Uncomment if needed)
# -----------------------------------------------------------------------------
# Laravel's scheduler runs periodic tasks (cleanup, reports, etc.)
# It needs to run every minute.
#
# Alternative: Use a cron job on the host or a separate container
# -----------------------------------------------------------------------------
# [program:laravel-scheduler]
# command=php /var/www/html/artisan schedule:work
# autostart=true
# autorestart=true
# user=www-data
# redirect_stderr=true
# stdout_logfile=/var/log/supervisor/scheduler.log
# stdout_logfile_maxbytes=10MB
# stdout_logfile_backups=5

# =============================================================================
# DEVELOPMENT VS PRODUCTION CHANGES:
# =============================================================================
#
# FOR PRODUCTION, YOU WOULD:
#
# 1. INCREASE queue workers:
#    numprocs=4 or more (based on server resources)
#
# 2. ADD monitoring:
#    - Use supervisor's event listeners for alerts
#    - Integrate with monitoring tools (Datadog, New Relic)
#
# 3. ADD log rotation:
#    - Use logrotate for log files
#    - Or send logs to centralized logging
#
# 4. RUN as non-root:
#    user=www-data (for all programs)
#    (Requires proper permission setup)
#
# 5. ADD health checks:
#    - Monitor if workers are processing jobs
#    - Alert if queue is growing too large
#
# 6. CONSIDER Horizon (for Redis queues):
#    - Laravel Horizon provides a dashboard
#    - Better monitoring and management
#    - Install: composer require laravel/horizon
#
# 7. ADD process priorities:
#    - PHP-FPM should have higher priority
#    - Workers can wait if resources are limited
# =============================================================================