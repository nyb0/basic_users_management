# =============================================================================
# NGINX CONFIGURATION - Development Mode
# =============================================================================
#
# WHAT THIS FILE DOES:
# This configuration tells Nginx how to handle incoming HTTP requests.
# It serves static files directly and forwards PHP requests to PHP-FPM.
#
# KEY CONCEPTS:
# - server block: Virtual host configuration
# - location block: How to handle specific URL patterns
# - upstream: Backend server (PHP-FPM in our case)
# - fastcgi_pass: Connect to PHP-FPM via FastCGI protocol
#
# =============================================================================

# -----------------------------------------------------------------------------
# UPSTREAM DEFINITION
# -----------------------------------------------------------------------------
# Upstream defines backend servers that Nginx can proxy to.
# "app" is the container name of our PHP-FPM service.
# Port 9000 is the default PHP-FPM port.
#
# In Docker, containers can reach each other by container name.
# This is why we use "app:9000" instead of "localhost:9000".
# -----------------------------------------------------------------------------
upstream php-fpm {
    server app:9000;
}

# -----------------------------------------------------------------------------
# SERVER BLOCK
# -----------------------------------------------------------------------------
# A server block defines a virtual host.
# You can have multiple server blocks for different domains.
# -----------------------------------------------------------------------------
server {
    # Listen on port 80 (HTTP)
    # In production, you'd also listen on 443 (HTTPS)
    listen 80;
    listen [::]:80;  # IPv6 support
    
    # Server name (domain name)
    # Use "_" to match any hostname (useful for development)
    server_name localhost _;
    
    # Document root - where static files are located
    # This path matches the volume mount in docker-compose.yml
    root /var/www/html/public;
    
    # Default index files
    # Nginx tries these files in order when accessing a directory
    index index.php index.html index.htm;
    
    # -------------------------------------------------------------------------
    # SECURITY HEADERS
    # -------------------------------------------------------------------------
    # These headers protect against common web vulnerabilities.
    # In production, you'd add more headers (CSP, HSTS, etc.)
    # -------------------------------------------------------------------------
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection in browsers
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy (controls what's sent in Referer header)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # GZIP COMPRESSION
    # -------------------------------------------------------------------------
    # Gzip reduces file sizes for faster transfer.
    # This is especially important for CSS, JS, and JSON files.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;                      # Add Vary: Accept-Encoding header
    gzip_min_length 1024;              # Only compress files > 1KB
    gzip_proxied any;                  # Compress for all proxies
    gzip_comp_level 6;                 # Compression level (1-9, 6 is good balance)
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/json
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    # -------------------------------------------------------------------------
    # MAIN LOCATION BLOCK
    # -------------------------------------------------------------------------
    # This handles all requests that don't match other location blocks.
    # The try_files directive tries to serve the file directly first,
    # then falls back to index.php with the query string.
    #
    # How Laravel routing works:
    # 1. Request: /users/123
    # 2. Nginx checks if /users/123 exists as a file -> No
    # 3. Nginx checks if /users/123 exists as a directory -> No
    # 4. Nginx forwards to /index.php?/users/123
    # 5. Laravel's router handles the request
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # PHP PROCESSING
    # -------------------------------------------------------------------------
    # This block handles all .php files.
    # It forwards requests to PHP-FPM via FastCGI protocol.
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        # Pass to PHP-FPM upstream defined above
        fastcgi_pass php-fpm;
        
        # Include standard FastCGI parameters
        # This file comes with Nginx and sets common variables
        include fastcgi_params;
        
        # SCRIPT_FILENAME tells PHP-FPM which file to execute
        # $realpath_root = document root with symlinks resolved
        # $fastcgi_script_name = the PHP file path from URL
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        
        # PHP-FPM reads this to set the correct working directory
        fastcgi_param PHP_VALUE "max_execution_time=300\nmemory_limit=256M";
        
        # Hide PHP version header (security)
        fastcgi_hide_header X-Powered-By;
        
        # Increase timeout for long-running requests
        # Useful for imports, exports, etc.
        fastcgi_read_timeout 300;
        
        # Buffer settings for better performance
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # -------------------------------------------------------------------------
    # DENY ACCESS TO HIDDEN FILES
    # -------------------------------------------------------------------------
    # Block access to files starting with . (except .well-known)
    # This protects .env, .git, .htaccess, etc.
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    # STATIC FILE CACHING
    # -------------------------------------------------------------------------
    # Static assets (images, CSS, JS) rarely change.
    # We cache them in the browser for 1 year for better performance.
    # "immutable" tells browsers the file won't change (no revalidation)
    # -------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;  # Don't log static file requests
        
        # Try to serve the file directly, fall back to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # VITE HOT MODULE REPLACEMENT (Development Only)
    # -------------------------------------------------------------------------
    # Vite uses WebSocket for hot module replacement (HMR).
    # This location block proxies HMR requests to Vite's dev server.
    # Note: This is only needed when running "npm run dev" inside container.
    # For production, remove this block.
    # -------------------------------------------------------------------------
    location /build {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # LARAVEL STORAGE LINK
    # -------------------------------------------------------------------------
    # Laravel's storage:link creates a symlink from public/storage to storage/app/public
    # This block ensures those files are accessible.
    # -------------------------------------------------------------------------
    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # ERROR PAGES
    # -------------------------------------------------------------------------
    # Custom error pages (optional, Laravel handles most errors)
    # -------------------------------------------------------------------------
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

